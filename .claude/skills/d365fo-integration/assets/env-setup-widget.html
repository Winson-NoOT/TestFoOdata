<div style="max-width:480px;padding:24px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary)">
  <p style="margin:0 0 4px;font-size:16px;font-weight:500;color:var(--color-text-primary)">D365FO environment setup</p>
  <p style="margin:0 0 20px;font-size:13px;color:var(--color-text-secondary)">If the environment is already saved in config, enter the App Name only and leave the rest blank.</p>
  <div style="display:flex;flex-direction:column;gap:14px">
    <label style="font-size:13px;font-weight:500;color:var(--color-text-primary)">App Name <span style="font-weight:400;color:var(--color-text-secondary)">(friendly label, required)</span>
      <input id="d365-appName" placeholder="e.g. Schaefer-DEV" style="margin-top:5px;display:block;width:100%;box-sizing:border-box">
    </label>
    <label style="font-size:13px;font-weight:500;color:var(--color-text-primary)">Tenant ID
      <input id="d365-tenantId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" style="margin-top:5px;display:block;width:100%;box-sizing:border-box">
    </label>
    <label style="font-size:13px;font-weight:500;color:var(--color-text-primary)">Client ID
      <input id="d365-clientId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" style="margin-top:5px;display:block;width:100%;box-sizing:border-box">
    </label>
    <label style="font-size:13px;font-weight:500;color:var(--color-text-primary)">Client Secret <span style="font-weight:400;color:var(--color-text-secondary)">(value, not the secret ID)</span>
      <input id="d365-clientSecret" type="password" placeholder="••••••••••••" style="margin-top:5px;display:block;width:100%;box-sizing:border-box">
    </label>
    <label style="font-size:13px;font-weight:500;color:var(--color-text-primary)">Base URL <span style="font-weight:400;color:var(--color-text-secondary)">(no trailing slash)</span>
      <input id="d365-baseUrl" placeholder="https://yourenv.operations.dynamics.com" style="margin-top:5px;display:block;width:100%;box-sizing:border-box">
    </label>
    <button onclick="d365Submit()" style="margin-top:4px">Submit ↗</button>
  </div>
  <script>
    function d365Submit() {
      const v = id => document.getElementById(id).value.trim();
      const appName = v('d365-appName');
      if (!appName) { alert('App Name is required.'); return; }
      const parts = ['App Name: ' + appName];
      const tenantId = v('d365-tenantId'), clientId = v('d365-clientId');
      const clientSecret = v('d365-clientSecret'), baseUrl = v('d365-baseUrl');
      if (tenantId) parts.push('Tenant ID: ' + tenantId);
      if (clientId) parts.push('Client ID: ' + clientId);
      if (clientSecret) parts.push('Client Secret: ' + clientSecret);
      if (baseUrl) parts.push('Base URL: ' + baseUrl);
      sendPrompt('D365FO env details:\n' + parts.join('\n'));
    }
  </script>
</div>
